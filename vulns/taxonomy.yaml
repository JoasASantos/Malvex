version: 2
vectors:
  - id: triage-initial
    title: Initial malware triage and dossier
    sev: info
    platforms: [windows, linux, macos]
    agent: triage
    tools: [file, die, lief, yara, strings]
    prior_ref: null
    detect: "hashes, real type, architecture, signing, timestamp, entropy, sections, imports, strings, initial IOCs"

  - id: static-analysis
    title: Static format-aware analysis
    sev: info
    platforms: [windows, linux, macos]
    agent: static-core
    tools: [lief, ghidra, radare2, otool, readelf]
    prior_ref: null
    detect: "headers, resources, manifests, TLS, relocations, runtime/framework fingerprints, sensitive APIs"

  - id: disassembly-decompilation
    title: Deep disassembly, decompilation, and function renaming
    sev: info
    platforms: [windows, linux, macos]
    agent: decompilation
    tools: [ida-pro, ghidra, radare2, binaryninja]
    prior_ref: null
    detect: "main flow, call graph, CFG, xrefs, function roles, structures, indirect calls, syscalls"

  - id: packing-obfuscation
    title: Packing and obfuscation recovery
    sev: medium
    platforms: [windows, linux, macos]
    agent: deobfuscation
    tools: [upx, die, yara, x64dbg, lldb, unicorn]
    prior_ref: null
    detect: "packer/protector, OEP, runtime unpacking, string/API decryption, CFF, staged payloads"

  - id: debugging
    title: Debugging strategy and runtime breakpointing
    sev: info
    platforms: [windows, linux, macos]
    agent: dynamic-analysis
    tools: [x64dbg, windbg, lldb, gdb, frida]
    prior_ref: null
    detect: "entrypoint and key breakpoints, args, registers, stack, threads, exceptions, resolved APIs"

  - id: dynamic-analysis
